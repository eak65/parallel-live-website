<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Payment Successful - Parallel Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Roboto, Arial;
      background: #eef3f8;
      color: #0b1324;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .card {
      width: 100%; max-width: 520px;
      background: #fff;
      border-radius: 18px;
      box-shadow:
        0 32px 90px rgba(17, 24, 39, 0.18),
        0 4px 10px rgba(17, 24, 39, 0.06);
      padding: 26px 26px 18px;
      text-align: center;
    }
    h1 { font-size: 24px; margin: 0 0 20px; font-weight: 800; color: #059669; }
    p { margin: 0; color: #4c5875; line-height: 1.45; font-size: 16px; }
    p + p { margin-top: 10px; }
    
    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .checkmark {
      width: 32px;
      height: 32px;
      fill: white;
    }
    
    .app-button {
      margin: 24px auto 0;
      width: 100%;
      max-width: 300px;
      height: 56px;
      background: #0369a1;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    
    .app-button:hover {
      background: #0284c7;
    }
    
    .loading-dots {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 20px;
    }
    
    .loading-dots div {
      position: absolute;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0369a1;
      animation-timing-function: cubic-bezier(0, 1, 1, 0);
    }
    
    .loading-dots div:nth-child(1) {
      left: 8px;
      animation: loading1 0.6s infinite;
    }
    
    .loading-dots div:nth-child(2) {
      left: 8px;
      animation: loading2 0.6s infinite;
    }
    
    .loading-dots div:nth-child(3) {
      left: 32px;
      animation: loading2 0.6s infinite;
    }
    
    .loading-dots div:nth-child(4) {
      left: 56px;
      animation: loading3 0.6s infinite;
    }
    
    @keyframes loading1 {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    
    @keyframes loading3 {
      0% { transform: scale(1); }
      100% { transform: scale(0); }
    }
    
    @keyframes loading2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(24px, 0); }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="success-icon">
      <svg class="checkmark" viewBox="0 0 24 24">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
    </div>
    
    <h1>Payment Successful!</h1>
    <p>Welcome to Parallel Live Premium!</p>
    <p id="message">Redirecting you back to the app...</p>
    
    <div id="loadingIndicator">
      <div class="loading-dots">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    
    <button class="app-button" id="appButton" style="display: none;" onclick="openApp()">
      Return to App
    </button>
  </div>
</div>

<script>
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  const forceApp = urlParams.get('forceApp');
  const subscriptionId = urlParams.get('sid');
  const userId = urlParams.get('userId');
  
  console.log('Success page loaded:', { forceApp, subscriptionId, userId });
  
  let redirectAttempted = false;
  
  function attemptAppRedirect() {
    if (redirectAttempted) return;
    redirectAttempted = true;
    
    console.log('Attempting app redirect...');
    
    // Create the universal link URL
    const currentUrl = new URL(window.location.href);
    
    if (forceApp === 'true') {
      // Update the parameter to indicate we've tried the redirect
      currentUrl.searchParams.set('forceApp', 'attempted');
      
      // Force a page reload to trigger universal link
      console.log('Forcing page reload for universal link...');
      window.location.href = currentUrl.toString();
    } else if (forceApp === 'attempted') {
      // We've already tried the automatic redirect, show manual option
      console.log('Automatic redirect attempted, showing manual button');
      document.getElementById('message').textContent = 'Tap the button below to return to the app:';
      document.getElementById('loadingIndicator').style.display = 'none';
      document.getElementById('appButton').style.display = 'block';
    } else {
      // Normal web user, try universal link naturally
      setTimeout(() => {
        console.log('Natural universal link attempt...');
        // For users coming from web, this should work normally
        document.getElementById('message').textContent = 'Tap the button below to return to the app:';
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('appButton').style.display = 'block';
      }, 2000);
    }
  }
  
  function openApp() {
    const currentUrl = new URL(window.location.href);
    // Remove forceApp parameter for clean universal link
    currentUrl.searchParams.delete('forceApp');
    
    console.log('Manual app open attempt:', currentUrl.toString());
    
    // Try to open the app
    window.location.href = currentUrl.toString();
    
    // If the app doesn't open within 3 seconds, show fallback
    setTimeout(() => {
      document.getElementById('message').textContent = 'If the app didn\'t open, please close this browser and return to the app manually.';
    }, 3000);
  }
  
  // Start the redirect process
  if (forceApp) {
    // Small delay to let the page load completely
    setTimeout(attemptAppRedirect, 500);
  } else {
    // Regular web user flow
    attemptAppRedirect();
  }
  
  // Expose openApp function globally
  window.openApp = openApp;
})();
</script>
</body>
</html>
