<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Success! - Parallel Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Roboto, Arial;
      background: #eef3f8;
      color: #0b1324;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .card {
      width: 100%; max-width: 520px;
      background: #fff;
      border-radius: 18px;
      box-shadow:
        0 32px 90px rgba(17, 24, 39, 0.18),
        0 4px 10px rgba(17, 24, 39, 0.06);
      padding: 26px 26px 18px;
      text-align: center;
    }
    h1 { font-size: 24px; margin: 0 0 20px; font-weight: 800; color: #059669; }
    p { margin: 0; color: #4c5875; line-height: 1.45; font-size: 16px; }
    p + p { margin-top: 10px; }
    
    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .checkmark {
      width: 32px;
      height: 32px;
      fill: white;
    }
    
    .app-button {
      margin: 24px auto 0;
      width: 100%;
      max-width: 300px;
      height: 56px;
      background: #0369a1;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    
    .app-button:hover {
      background: #0284c7;
    }
    
    /* Debug info display */
    .debug-info {
      margin: 20px 0;
      padding: 16px;
      background: #f3f4f6;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      text-align: left;
      color: #374151;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .debug-info .debug-line {
      margin: 4px 0;
      padding: 2px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .loading-dots {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 20px;
    }
    
    .loading-dots div {
      position: absolute;
      top: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0369a1;
      animation-timing-function: cubic-bezier(0, 1, 1, 0);
    }
    
    .loading-dots div:nth-child(1) {
      left: 8px;
      animation: loading1 0.6s infinite;
    }
    
    .loading-dots div:nth-child(2) {
      left: 8px;
      animation: loading2 0.6s infinite;
    }
    
    .loading-dots div:nth-child(3) {
      left: 32px;
      animation: loading2 0.6s infinite;
    }
    
    .loading-dots div:nth-child(4) {
      left: 56px;
      animation: loading3 0.6s infinite;
    }
    
    @keyframes loading1 {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    
    @keyframes loading3 {
      0% { transform: scale(1); }
      100% { transform: scale(0); }
    }
    
    @keyframes loading2 {
      0% { transform: translate(0, 0); }
      100% { transform: translate(24px, 0); }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="success-icon">
      <svg class="checkmark" viewBox="0 0 24 24">
        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
      </svg>
    </div>
    
    <h1>Success!</h1>
    <p>Welcome to Parallel Live Premium!</p>
    <p id="message">Redirecting you back to the app...</p>
    
    <div id="loadingIndicator">
      <div class="loading-dots">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    
    <button class="app-button" id="appButton" style="display: none;" onclick="openApp()">
      Return to App
    </button>
    
    <div class="debug-info" id="debugInfo">
      <div class="debug-line"><strong>Debug Information:</strong></div>
    </div>
  </div>
</div>

<script>
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  const forceApp = urlParams.get('forceApp');
  const subscriptionId = urlParams.get('sid');
  const userId = urlParams.get('userId');
  
  let redirectAttempted = false;
  
  // Debug logging function
  function debugLog(message) {
    console.log(message);
    const debugDiv = document.getElementById('debugInfo');
    const newLine = document.createElement('div');
    newLine.className = 'debug-line';
    newLine.textContent = new Date().toLocaleTimeString() + ': ' + message;
    debugDiv.appendChild(newLine);
    debugDiv.scrollTop = debugDiv.scrollHeight;
  }
  
  debugLog('Success page loaded');
  debugLog('forceApp = ' + forceApp);
  debugLog('subscriptionId = ' + subscriptionId);
  debugLog('userId = ' + userId);
  debugLog('Current URL = ' + window.location.href);
  
  function attemptAppRedirect() {
    if (redirectAttempted) {
      debugLog('Redirect already attempted, skipping');
      return;
    }
    redirectAttempted = true;
    
    debugLog('Starting app redirect attempt...');
    
    // Create the universal link URL
    const currentUrl = new URL(window.location.href);
    
    if (forceApp === 'true') {
      // Try universal link first
      currentUrl.searchParams.set('forceApp', 'attempted');
      debugLog('Trying universal link redirect to: ' + currentUrl.toString());
      window.location.href = currentUrl.toString();
      
      // Fallback to custom URL scheme after 2 seconds
      setTimeout(() => {
        debugLog('Universal link timeout, trying custom URL scheme...');
        const customUrl = `parallel://checkout_success?sid=${subscriptionId || ''}&userId=${userId || ''}`;
        debugLog('Custom URL: ' + customUrl);
        window.location.href = customUrl;
      }, 2000);
      
    } else if (forceApp === 'attempted') {
      // We've already tried the automatic redirect, show manual option
      debugLog('Automatic redirect was attempted, showing manual button');
      document.getElementById('message').textContent = 'Tap the button below to return to the app:';
      document.getElementById('loadingIndicator').style.display = 'none';
      document.getElementById('appButton').style.display = 'block';
    } else {
      // Normal web user, try universal link naturally
      debugLog('Normal web user flow, showing manual option after delay');
      setTimeout(() => {
        debugLog('Showing manual return button');
        document.getElementById('message').textContent = 'Tap the button below to return to the app:';
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('appButton').style.display = 'block';
      }, 2000);
    }
  }
  
  function openApp() {
    debugLog('Manual app open button clicked');
    
    // Try both universal link and custom scheme
    const currentUrl = new URL(window.location.href);
    currentUrl.searchParams.delete('forceApp');
    
    debugLog('Trying universal link: ' + currentUrl.toString());
    window.location.href = currentUrl.toString();
    
    // Fallback to custom scheme after 1 second
    setTimeout(() => {
      debugLog('Manual universal link timeout, trying custom scheme...');
      const customUrl = `parallel://checkout_success?sid=${subscriptionId || ''}&userId=${userId || ''}`;
      debugLog('Manual custom URL: ' + customUrl);
      window.location.href = customUrl;
    }, 1000);
    
    // If nothing works, show message
    setTimeout(() => {
      debugLog('All redirect attempts failed');
      document.getElementById('message').textContent = 'If the app didn\'t open, please close this browser and return to the app manually.';
    }, 3000);
  }
  
  // Start the redirect process
  if (forceApp) {
    debugLog('forceApp parameter detected, starting redirect in 500ms...');
    // Small delay to let the page load completely
    setTimeout(attemptAppRedirect, 500);
  } else {
    debugLog('No forceApp parameter, using regular flow');
    // Regular web user flow
    attemptAppRedirect();
  }
  
  // Expose openApp function globally
  window.openApp = openApp;
})();
</script>
</body>
</html>
