<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Subscribe with Apple Pay — DEBUG v5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body { font-family:-apple-system, system-ui, Arial; margin:0; padding:24px; background:#0b0b0b; color:#fff; }
    #wrap { max-width:560px; margin:0 auto; text-align:center; }
    h1 { font-size:22px; margin:0 0 8px; }
    p  { opacity:.85; margin:0 0 18px; }

    /* PRB container – block, fixed height */
    #apple{
      display:block;
      width:100%; max-width:520px;
      height:56px;               /* give the iframe room */
      margin:24px auto 12px;
      background:rgba(0,200,255,.08);
      outline:2px dashed #0af; outline-offset:4px;
      position:relative; z-index:999999; pointer-events:auto;
    }

    /* Force the Stripe iframe to occupy the box */
    #apple > iframe { width:100% !important; height:100% !important; display:block !important; pointer-events:auto !important; }

    /* Fallback tap overlay (only shown if needed) */
    #tapOverlay{
      position:absolute; inset:0; display:none; align-items:center; justify-content:center;
      background:transparent; z-index:1000000;
    }
    #tapOverlay button{
      background:#fff; color:#000; border:0; border-radius:12px; padding:12px 16px;
      font-size:17px; font-weight:700;
    }

    /* On-page log */
    #msg { margin-top:12px; white-space:pre-wrap; text-align:left; font-size:13px; opacity:.95; }

    /* Version badge */
    #version{
      position:fixed; top:10px; right:12px; background:rgba(0,0,0,.7);
      color:#0ff; padding:4px 8px; font-size:12px; border-radius:6px; z-index:100001; font-weight:bold;
    }

    /* In-app context banner */
    .banner{ position:fixed; left:0; right:0; bottom:0; background:#111; color:#fff; padding:12px; text-align:center; z-index:100000 }
    .banner a{ color:#0af; text-decoration:underline }
  </style>
</head>
<body>
<div id="version">v5</div>
<div id="wrap">
  <h1>Pro Access</h1>
  <p>Apple Pay only — no card fields. All logs shown below.</p>

  <div id="apple">
    <div id="tapOverlay"><button>Pay with Pay</button></div>
  </div>

  <pre id="msg"></pre>
</div>

<script>
const log=(...a)=>{console.log("[AP DEBUG]",...a);const s=a.map(x=>typeof x==="object"?JSON.stringify(x,null,2):String(x)).join(" ");document.querySelector("#msg").textContent+=s+"\n";};
window.onerror=(m,s,l,c,e)=>log("window.onerror",m,s+":"+l,e&&e.stack?e.stack:e);
window.addEventListener("unhandledrejection",e=>log("unhandledrejection",e.reason));

(function(){
  const ua=navigator.userAgent;
  const isInApp=/(FBAN|FBAV|FB_IAB|Line|Instagram|GSA|Twitter|TikTok|Snap|Pinterest|DuckDuckGo)/i.test(ua);
  const isSafariVC=/\bSFSafariViewController\b/i.test(ua);
  const notTop=(top!==self);
  const notHttps=location.protocol!=="https:";
  if(isInApp||isSafariVC||notTop||notHttps){
    const bar=document.createElement("div");
    bar.className="banner";
    bar.innerHTML='For Apple Pay, open in Safari. <a href="'+location.href+'">Open</a>';
    document.body.appendChild(bar);
    log("Context might block Apple Pay:",{isInApp,isSafariVC,notTop,notHttps,ua});
  }
})();

(async()=>{
  // ===== your config =====
  const PUBLISHABLE_KEY="pk_test_51ObAxXDRnH8DK8R5nX6dHGi7xwvx4BiWVzdQRMWqWadtEaLUm08hoGaugND76UTP9OuELxXJvqewWVHFEBB1ck7J00Jc9MvsTG";
  const SETUP_INTENT_URL="https://rkwv6kbjm3d6bmpmwc4h2p6ppe0wvgth.lambda-url.us-east-1.on.aws/";
  const CREATE_SUB_URL="https://kr57xusgm2fufauejxnxwfq72q0sctva.lambda-url.us-east-1.on.aws/";
  const SUCCESS_RETURN_URL="https://parallellive.app/checkout_redirect/success";
  // =======================

  // URL params
  const url=new URL(location.href);
  const userId=url.searchParams.get("userId")||"";
  const sub_type=url.searchParams.get("sub_type")||"weekly";
  const isDiscounted=(url.searchParams.get("isDiscounted")||"false")==="true";
  const emailParam=url.searchParams.get("email")||"";

  // env
  log("host",location.host,"https",location.protocol==="https:","top-level",top===self);
  log("UA",navigator.userAgent);
  log("ApplePaySession exists:",!!window.ApplePaySession,"native canMakePayments:",window.ApplePaySession?.canMakePayments?.());

  // 1) SetupIntent
  log("POST SetupIntent",{url:SETUP_INTENT_URL,body:{userId}});
  let clientSecret="";
  try{
    const res=await fetch(SETUP_INTENT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId})});
    const text=await res.text();
    log("SetupIntent status",res.status,"raw:",text);
    const json=JSON.parse(text);
    if(!res.ok) throw new Error(json.error||("HTTP "+res.status));
    if(!json.clientSecret) throw new Error("No clientSecret in SetupIntent response");
    clientSecret=json.clientSecret;
    log("clientSecret (setup) prefix",clientSecret.substring(0,24)+"…");
  }catch(e){ log("SetupIntent fetch error:",e.message); return; }

  // 2) Stripe + PRB
  const stripe=Stripe(PUBLISHABLE_KEY);
  log("Stripe.js version",stripe.version||"n/a");
  const elements=stripe.elements({clientSecret}); // setup-mode

  const pr=stripe.paymentRequest({
    country:"US",
    currency:"usd",
    total:{label:"Pro Access",amount:0},
    requestPayerEmail:true
  });

  let can=null;
  try{ can=await pr.canMakePayment(); }catch(e){ log("canMakePayment error",e.message); }
  log("Stripe canMakePayment →",can);
  if(!(can&&(can.applePay||can.applePay===true))){
    document.getElementById("apple").style.display="none";
    log("Apple Pay unavailable in this context.");
    return;
  }

  const container=document.getElementById("apple");
  const tapOverlay=document.getElementById("tapOverlay");

  // Create & mount PRB with explicit height
  let prb=elements.create("paymentRequestButton",{
    paymentRequest:pr,
    style:{ paymentRequestButton:{ type:"applePay", height:"48px" } } // 👈 enforce height
  });
  prb.on("ready",()=>log("PRB ready"));

  function mountPRB(){
    try{
      prb.mount("#apple");
      log("PRB mounted");
    }catch(e){
      log("PRB mount error",e.message);
    }
  }
  mountPRB();

  // Diagnostics + fix-up if iframe is too skinny
  function diag(tag){
    const ifr=container.querySelector("iframe");
    const cs=getComputedStyle(container);
    const crect=container.getBoundingClientRect();
    let info={};
    if(ifr){
      const ir=ifr.getBoundingClientRect();
      const ics=getComputedStyle(ifr);
      const cx=Math.round(ir.left+ir.width/2), cy=Math.round(ir.top+ir.height/2);
      const topEl=document.elementFromPoint(cx,cy);
      info={ iframeRect:ir, iframeStyles:{ display:ics.display, visibility:ics.visibility, opacity:ics.opacity, pointerEvents:ics.pointerEvents, position:ics.position, zIndex:ics.zIndex, width:ics.width, height:ics.height },
             hitPoint:{x:cx,y:cy}, elementFromPoint: topEl && { tag:topEl.tagName, id:topEl.id, class:topEl.className } };
      // If width < 40px, try a remount after forcing a layout class
      if(ir.width < 40){
        log("Iframe width looks too small → applying layout fix and remounting");
        container.classList.add("fixWidth");
        // Nuke existing element and remount clean
        try{ prb.unmount(); }catch(_){}
        prb=elements.create("paymentRequestButton",{ paymentRequest:pr, style:{ paymentRequestButton:{ type:"applePay", height:"48px" } } });
        prb.on("ready",()=>log("PRB ready (after fix)"));
        setTimeout(mountPRB, 50);
      }
    } else {
      tapOverlay.style.display="flex"; // fallback if iframe missing
    }
    log(tag||"diag","\ncontainerRect",crect,"\ncontainerStyles",
        {display:cs.display,visibility:cs.visibility,opacity:cs.opacity,position:cs.position,zIndex:cs.zIndex,transform:cs.transform,overflow:cs.overflow,pointerEvents:cs.pointerEvents},
        "\niframePresent",!!ifr, info);
  }
  setTimeout(()=>diag("after 350ms"),350);
  setTimeout(()=>diag("after 1000ms"),1000);

  // Fallback overlay: call pr.show() on tap if iframe sizing is wrong
  tapOverlay.addEventListener("click", async (e)=>{
    e.preventDefault(); e.stopPropagation();
    try{
      if(typeof pr.show==="function"){ log("Overlay tap → pr.show()"); await pr.show(); }
      else{ log("pr.show() not available on this Stripe paymentRequest object."); }
    }catch(err){ log("pr.show() error:", err && (err.message||String(err))); }
  }, { passive:false });

  // 3) Payment flow
  pr.on("paymentmethod",async(ev)=>{
    log("PRB paymentmethod",{ pm:ev.paymentMethod&&ev.paymentMethod.id, payerEmail:ev.payerEmail });
    try{
      const setupRes=await stripe.confirmCardSetup(clientSecret,{
        payment_method:ev.paymentMethod.id,
        payment_method_data:{ billing_details:{ email: ev.payerEmail || emailParam || undefined } }
      });
      log("confirmCardSetup result",setupRes);

      if(setupRes.error){ ev.complete("fail"); log("confirmCardSetup error",setupRes.error); return; }

      ev.complete("success");
      const paymentMethodId=setupRes.setupIntent?.payment_method || ev.paymentMethod.id;
      log("Using paymentMethodId",paymentMethodId);

      const payload={ paymentMethodId, userId, email: ev.payerEmail || emailParam || "", sub_type, isDiscounted };
      log("POST CreateSubscription",{ url: CREATE_SUB_URL, body: payload });

      const subRes=await fetch(CREATE_SUB_URL,{ method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
      const subText=await subRes.text();
      log("CreateSubscription status",subRes.status,"raw:",subText);
      let subJson={}; try{ subJson=JSON.parse(subText);}catch(_){}
      if(!subRes.ok||subJson.error) throw new Error(subJson.error||("Create subscription failed ("+subRes.status+")"));

      const sid=subJson.subscriptionId||"";
      const redirect=new URL(SUCCESS_RETURN_URL);
      redirect.searchParams.set("userId",userId);
      redirect.searchParams.set("sub_type",sub_type);
      if(sid) redirect.searchParams.set("sid",sid);
      log("Redirecting to",redirect.toString());
      location.href=redirect.toString();

    }catch(e){ log("Apple Pay flow error",e.message); }
  });
})();
</script>
</body>
</html>
