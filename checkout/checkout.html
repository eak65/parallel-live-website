<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Subscribe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { font-family: -apple-system, system-ui; margin:0; padding:16px; background:#0b0b0b; color:#fff; }
    #wrap { max-width:520px; margin:0 auto; }
    h1 { font-size:22px; margin:0 0 8px; }
    p  { opacity:.75; margin:0 0 16px; }
    #apple { margin:20px 0; }
    #or { text-align:center; opacity:.6; margin:18px 0; }
    #card { margin-top:8px; }
    button.action { width:100%; padding:14px; font-size:17px; border-radius:12px; border:0; }
    #msg { margin-top:16px; min-height:20px; }
    .hidden { display:none; }
    .disabled { opacity:.5; pointer-events:none; }
  </style>
</head>
<body>
<div id="wrap">
  <h1>Pro Access</h1>
  <p>Fast, secure checkout. Apple Pay when available.</p>

  <div id="apple"></div>
  <div id="or" class="hidden">or pay with card</div>

  <div id="card" class="hidden">
    <div id="payment-element"></div>
    <button id="card-pay" class="action disabled">Pay</button>
  </div>

  <div id="msg"></div>
</div>

<script>
(async () => {
  // ================= YOUR CONFIG =================
  const PUBLISHABLE_KEY    = "pk_test_51ObAxXDRnH8DK8R5nX6dHGi7xwvx4BiWVzdQRMWqWadtEaLUm08hoGaugND76UTP9OuELxXJvqewWVHFEBB1ck7J00Jc9MvsTG";
  // Use your DEBUG setupIntent-style endpoint while testing:
  const SETUP_SUB_URL      = "https://rkwv6kbjm3d6bmpmwc4h2p6ppe0wvgth.lambda-url.us-east-1.on.aws/";
  // Swap to prod when ready:
  // const SETUP_SUB_URL   = "https://iklqyrk23vk2pdvvhsf6xdcpcy0nrhig.lambda-url.us-east-1.on.aws/";
  const SUCCESS_RETURN_URL = "https://yourdomain.com/checkout_redirect/success"; // <-- universal link
  // ================================================

  // Params from the app (e.g., ?userId=...&sub_type=weekly&isDiscounted=false&email=...)
  const url          = new URL(window.location.href);
  const userId       = url.searchParams.get("userId") || "";
  const sub_type     = url.searchParams.get("sub_type") || "weekly";    // "weekly" | "annual"
  const isDiscounted = (url.searchParams.get("isDiscounted") || "false") === "true";
  const emailParam   = url.searchParams.get("email") || "";

  const stripe = Stripe(PUBLISHABLE_KEY);
  const setMsg = (t) => (document.querySelector("#msg").textContent = t || "");

  // 1) Ask your server to CREATE the subscription (with free trial)
  //    and return the FIRST INVOICE PaymentIntent client_secret.
  //    Body: { userId, email, sub_type, isDiscounted }
  setMsg("Preparing checkout…");
  const setupRes = await fetch(SETUP_SUB_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      email: emailParam || "",
      sub_type,
      isDiscounted
    })
  });

  let setupJson = {};
  try { setupJson = await setupRes.json(); } catch (_) {}
  if (!setupRes.ok || !setupJson.clientSecret) {
    setMsg(setupJson.error || `Server error (${setupRes.status})`);
    return;
  }

  const clientSecret = setupJson.clientSecret;          // PI client secret from first invoice
  const subscriptionId = setupJson.subscriptionId || ""; // optional, if you return it

  // 2) Render Elements (card fallback)
  const elements = stripe.elements({ clientSecret });
  const paymentElement = elements.create("payment", { layout: "tabs" });
  paymentElement.mount("#payment-element");
  document.querySelector("#card").classList.remove("hidden");
  document.querySelector("#or").classList.remove("hidden");
  document.querySelector("#card-pay").classList.remove("disabled");

  // 3) Apple Pay via Payment Request Button (only shows if available)
  const pr = stripe.paymentRequest({
    country: "US",
    currency: "usd",
    total: { label: "Pro Access", amount: 0 }, // ignored for sub invoice PI
    requestPayerEmail: true
  });

  const canPay = await pr.canMakePayment();
  if (canPay && (canPay.applePay || canPay.applePay === true)) {
    const prButton = elements.create("paymentRequestButton", {
      paymentRequest: pr,
      style: { paymentRequestButton: { type: "applePay" } }
    });
    prButton.mount("#apple");

    // On tap -> confirm the PaymentIntent with the Apple Pay PM (✅ user gesture)
    pr.on("paymentmethod", async (ev) => {
      try {
        setMsg("Processing…");
        const { error } = await stripe.confirmPayment({
          clientSecret,
          payment_method: ev.paymentMethod.id,
          confirmParams: {
            return_url: SUCCESS_RETURN_URL
          }
        });
        ev.complete(error ? "fail" : "success");
        if (!error) {
          const redirect = new URL(SUCCESS_RETURN_URL);
          redirect.searchParams.set("userId", userId);
          redirect.searchParams.set("sub_type", sub_type);
          if (subscriptionId) redirect.searchParams.set("sid", subscriptionId);
          window.location.href = redirect.toString();
        } else {
          setMsg(error.message || "Payment failed.");
        }
      } catch (e) {
        console.error(e);
        setMsg(e.message || "Payment failed.");
        ev.complete("fail");
      }
    });
  } else {
    document.querySelector("#apple").classList.add("hidden");
  }

  // 4) Card fallback button (handles 3DS/next actions automatically)
  document.querySelector("#card-pay").addEventListener("click", async () => {
    setMsg("Processing…");
    const { error } = await stripe.confirmPayment({
      elements,
      clientSecret,
      confirmParams: {
        return_url: SUCCESS_RETURN_URL
      }
    });
    if (error) setMsg(error.message);
  });

  setMsg(""); // clear status
})();
</script>
</body>
</html>
