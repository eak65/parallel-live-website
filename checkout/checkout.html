<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Start Free Trial — v23</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Roboto, Arial;
      background: #eef3f8;
      color: #0b1324;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .card {
      width: 100%; max-width: 520px;
      background: #fff;
      border-radius: 18px;
      box-shadow:
        0 32px 90px rgba(17, 24, 39, 0.18),
        0 4px 10px rgba(17, 24, 39, 0.06);
      padding: 26px 26px 18px;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 10px; font-weight: 800; }
    h2 { font-size: 18px; margin: 18px 0 10px; font-weight: 800; }
    p  { margin: 0; color: #4c5875; line-height: 1.45; font-size: 15px; }
    p + p { margin-top: 6px; }

    /* Payment button container */
    .payment-container {
      margin: 18px auto 8px;
      width: 100%;
      max-width: 420px;
      height: 56px;
      position: relative;
    }

    /* Stripe Apple Pay button styling */
    #payment-request-button {
      width: 100% !important;
      height: 56px !important;
      border-radius: 14px !important;
    }

    /* Fallback button (hidden when Apple Pay is available) */
    .fallback-button {
      width: 100%;
      height: 56px;
      background: #000;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }
    
    .fallback-button:hover {
      background: #333;
    }
    
    .fallback-button:active {
      background: #555;
      transform: scale(0.98);
    }
    
    .apple-logo {
      width: 20px;
      height: 24px;
      fill: white;
    }

    /* Loading state */
    .loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Version badge */
    #ver {
      position: fixed; top: 10px; right: 12px;
      background: rgba(0,0,0,0.7); color: #0ff;
      font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: 700;
    }
    
    /* Status messages */
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
    
    .status.success {
      background: #f0f9ff;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }
    
    .status.error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    
    .status.info {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    /* Hide elements initially */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
<div id="ver">v23</div>

<div class="wrap">
  <div class="card" id="card">
    <div id="totalDue" class="hidden">
      <h1 id="totalAmount"></h1>
    </div>

    <div class="payment-container">
      <!-- Stripe will mount the Apple Pay button here -->
      <div id="payment-request-button" class="hidden"></div>
      
      <!-- Fallback button -->
      <button class="fallback-button hidden" id="fallbackBtn">
        <svg class="apple-logo" viewBox="0 0 24 24">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        Start Free Trial
      </button>
    </div>

    <h1>Why are we in a browser?</h1>
    <p>Starting your free trial here lets us avoid Apple's in-app fees, so we can keep trials free for everyone.</p>

    <h2>What happens next?</h2>
    <p>Once you're done, we'll take you right back to the app.<br/>You'll have thousands of fans waiting for you.</p>

    <div id="status"></div>
  </div>
</div>

<script>
(async () => {
  // ---- Config ----
  const PUBLISHABLE_KEY = "pk_test_51ObAxXDRnH8DK8R5nX6dHGi7xwvx4BiWVzdQRMWqWadtEaLUm08hoGaugND76UTP9OuELxXJvqewWVHFEBB1ck7J00Jc9MvsTG";
  const SETUP_INTENT_URL = "https://rkwv6kbjm3d6bmpmwc4h2p6ppe0wvgth.lambda-url.us-east-1.on.aws/";
  const CREATE_SUB_URL   = "https://kr57xusgm2fufauejxnxwfq72q0sctva.lambda-url.us-east-1.on.aws/";
  const SUCCESS_URL      = "https://parallellive.app/checkout_redirect/success";

  // Get URL parameters
  const url = new URL(location.href);
  const userId = url.searchParams.get("userId") || "";
  const sub_type = url.searchParams.get("sub_type") || "weekly";
  const isDiscounted = (url.searchParams.get("isDiscounted") || "false") === "true";
  const emailParam = url.searchParams.get("email") || "";
  const totalDueParam = url.searchParams.get("totalDue") || "";

  const paymentRequestButtonDiv = document.getElementById("payment-request-button");
  const fallbackButton = document.getElementById("fallbackBtn");
  const statusDiv = document.getElementById("status");
  const totalDueDiv = document.getElementById("totalDue");
  const totalAmountP = document.getElementById("totalAmount");
  
  // Show total due if provided
  if (totalDueParam) {
    totalAmountP.textContent = totalDueParam;
    totalDueDiv.classList.remove('hidden');
  }
  
  const showStatus = (message, type = 'info') => {
    statusDiv.className = `status ${type}`;
    statusDiv.textContent = message;
    statusDiv.style.display = 'block';
  };

  console.log("Starting Apple Pay setup...");
  console.log("User ID:", userId);
  console.log("Subscription type:", sub_type);
  console.log("User agent:", navigator.userAgent);

  // Check platform
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);
  const isMobile = /Mobi|Android/i.test(navigator.userAgent);
  
  console.log("Platform check: iOS=" + isIOS + ", Safari=" + isSafari + ", Mobile=" + isMobile);

  if (!isIOS && !isSafari) {
    showStatus("Apple Pay requires Safari on iOS or macOS", "error");
    fallbackButton.classList.remove('hidden');
    fallbackButton.textContent = 'Apple Pay Not Available';
    return;
  }

  let stripe;
  let paymentRequest;
  let clientSecret;

  // Initialize Stripe
  try {
    stripe = Stripe(PUBLISHABLE_KEY);
    console.log("Stripe initialized successfully");
  } catch (error) {
    console.error("Failed to initialize Stripe:", error);
    showStatus("Failed to initialize payment system", "error");
    return;
  }

  // Function to handle the payment flow
  const handlePayment = async (paymentMethod, payerEmail) => {
    try {
      showStatus("Processing payment...", "info");
      
      // 1) Create SetupIntent if we don't have one
      if (!clientSecret) {
        console.log("Creating SetupIntent...");
        showStatus("Creating payment session...", "info");
        
        const setupResponse = await fetch(SETUP_INTENT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId })
        });

        console.log("Setup Intent response status:", setupResponse.status);

        if (!setupResponse.ok) {
          throw new Error(`Setup failed: ${setupResponse.status}`);
        }

        const setupJson = await setupResponse.json();
        console.log("Setup Intent response:", setupJson);
        
        clientSecret = setupJson.clientSecret;
        
        if (!clientSecret) {
          throw new Error("No client secret received");
        }
        
        console.log("Got client secret:", clientSecret.substring(0, 20) + "...");
      }

      // 2) Confirm the setup intent with the payment method
      console.log("Confirming setup intent...");
      const confirmResult = await stripe.confirmCardSetup(clientSecret, {
        payment_method: paymentMethod.id,
        payment_method_data: {
          billing_details: {
            email: payerEmail || emailParam || undefined
          }
        }
      });

      if (confirmResult.error) {
        throw new Error(confirmResult.error.message);
      }

      console.log("Setup intent confirmed successfully");
      showStatus("Creating subscription...", "info");

      // 3) Create subscription
      const paymentMethodId = confirmResult.setupIntent?.payment_method || paymentMethod.id;
      const subscriptionPayload = {
        paymentMethodId,
        userId,
        email: payerEmail || emailParam || "",
        sub_type,
        isDiscounted
      };

      console.log("Creating subscription with payload:", subscriptionPayload);

      const subResponse = await fetch(CREATE_SUB_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(subscriptionPayload)
      });

      const subJson = await subResponse.json();
      console.log("Subscription response:", subJson);
      
      if (!subResponse.ok || subJson.error) {
        throw new Error(subJson.error || "Subscription creation failed");
      }

      // 4) Redirect to success
      const subscriptionId = subJson.subscriptionId || "";
      const redirectUrl = new URL(SUCCESS_URL);
      if (subscriptionId) redirectUrl.searchParams.set("sid", subscriptionId);
      redirectUrl.searchParams.set("userId", userId);
      redirectUrl.searchParams.set("sub_type", sub_type);
      
      console.log("Success! Redirecting to:", redirectUrl.toString());
      showStatus("Success! Redirecting...", "success");
      
      setTimeout(() => {
        window.location.href = redirectUrl.toString();
      }, 1000);

    } catch (error) {
      console.error("Payment error:", error);
      showStatus(`Error: ${error.message}`, "error");
      throw error;
    }
  };

  // Initialize payment request
  try {
    console.log("Creating payment request...");
    
    // Determine payment summary items based on subscription type
    let displayItems = [];
    let totalAmount = 0;
    let totalLabel = "Start Free Trial";
    
    if (sub_type === "weekly") {
      displayItems = [
        { label: "Weekly Subscription", amount: 999 }, // $9.99 in cents
        { label: "7-Day Free Trial", amount: -999 }    // -$9.99 discount
      ];
      totalAmount = 0;
      totalLabel = "Free Trial (Then $9.99/week)";
    } else if (sub_type === "annual" || sub_type === "yearly") {
      const price = isDiscounted ? 3499 : 6999; // $34.99 or $69.99 in cents
      displayItems = [
        { label: "Annual Subscription", amount: price },
        { label: "7-Day Free Trial", amount: -price }
      ];
      totalAmount = 0;
      totalLabel = isDiscounted ? "Free Trial (Then $34.99/year)" : "Free Trial (Then $69.99/year)";
    } else {
      // Default case
      displayItems = [
        { label: "Subscription", amount: 0 }
      ];
    }
    
    paymentRequest = stripe.paymentRequest({
      country: "US",
      currency: "usd",
      total: { label: totalLabel, amount: totalAmount },
      displayItems: displayItems,
      requestPayerEmail: true
    });

    console.log("Checking Apple Pay availability...");
    const canMakePayment = await paymentRequest.canMakePayment();
    console.log("Can make payment result:", canMakePayment);

    if (canMakePayment && canMakePayment.applePay) {
      console.log("Apple Pay is available, creating button...");
      
      // Set up payment method handler
      paymentRequest.on("paymentmethod", async (event) => {
        console.log("Payment method selected:", event.paymentMethod.id);
        
        try {
          await handlePayment(event.paymentMethod, event.payerEmail);
          event.complete("success");
        } catch (error) {
          console.error("Payment flow error:", error);
          event.complete("fail");
        }
      });

      // Create the payment request button
      const elements = stripe.elements();
      const prButton = elements.create("paymentRequestButton", {
        paymentRequest,
        style: {
          paymentRequestButton: {
            type: 'default', // Can be 'default', 'book', 'buy', or 'donate'
            theme: 'dark', // Can be 'dark', 'light', or 'light-outline'
            height: '56px'
          }
        }
      });

      console.log("Mounting payment request button...");
      
      // Mount the button
      await prButton.mount("#payment-request-button");
      
      console.log("Payment request button mounted, showing container...");
      paymentRequestButtonDiv.classList.remove('hidden');
      
      // Add some debugging to see if the button is actually visible
      setTimeout(() => {
        const buttonContainer = document.getElementById("payment-request-button");
        const iframe = buttonContainer.querySelector('iframe');
        
        console.log("Button container dimensions:", {
          width: buttonContainer.offsetWidth,
          height: buttonContainer.offsetHeight,
          display: getComputedStyle(buttonContainer).display
        });
        
        if (iframe) {
          console.log("Iframe dimensions:", {
            width: iframe.offsetWidth,
            height: iframe.offsetHeight,
            display: getComputedStyle(iframe).display
          });
        }
      }, 100);

    } else {
      console.log("Apple Pay not available, showing fallback");
      showStatus("Apple Pay not available on this device", "error");
      fallbackButton.classList.remove('hidden');
      
      // Set up fallback button click handler
      fallbackButton.onclick = () => {
        showStatus("Please use a device with Apple Pay support", "error");
      };
    }

  } catch (error) {
    console.error("Initialization error:", error);
    showStatus(`Initialization error: ${error.message}`, "error");
    fallbackButton.classList.remove('hidden');
    fallbackButton.textContent = 'Payment Error';
  }

})();
</script>
</body>
</html>
