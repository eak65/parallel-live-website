<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Subscribe with Apple Pay — DEBUG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body { font-family:-apple-system, system-ui, Arial; margin:0; padding:24px; background:#0b0b0b; color:#fff; }
    #wrap { max-width:560px; margin:0 auto; text-align:center; }
    h1 { font-size:22px; margin:0 0 8px; }
    p  { opacity:.85; margin:0 0 18px; }
    /* PRB container: make it impossible to collapse or hide */
    #apple {
      display:block; width:100%; max-width:480px; min-height:64px;
      margin:24px auto; padding:8px;
      background:rgba(0, 200, 255, .08);
      outline:2px dashed #0af; outline-offset:4px;
      position:relative; z-index:9999;
    }
    /* On-page log */
    #msg { margin-top:16px; white-space:pre-wrap; text-align:left; font-size:13px; opacity:.95; }
    /* Banner if we detect in-app browser/SFSafariVC/iframe/http */
    .banner { position:fixed; left:0; right:0; bottom:0; background:#111; color:#fff; padding:12px; text-align:center; z-index:10000 }
    .banner a { color:#0af; text-decoration:underline }
  </style>
</head>
<body>
<div id="wrap">
  <h1>Pro Access</h1>
  <p>Apple Pay only — no card fields. All logs shown below.</p>
  <div id="apple"></div>
  <pre id="msg"></pre>
</div>

<script>
/* ===== Ultra-verbose logger (console + on-page) ===== */
const log = (...a) => {
  console.log("[AP DEBUG]", ...a);
  const s = a.map(x => typeof x === "object" ? JSON.stringify(x, null, 2) : String(x)).join(" ");
  document.querySelector("#msg").textContent += s + "\n";
};
window.onerror = (m, s, l, c, e) => log("window.onerror", m, s+":"+l, e && e.stack ? e.stack : e);
window.addEventListener("unhandledrejection", e => log("unhandledrejection", e.reason));

/* ===== In-app browser detector (suggest Safari) ===== */
(function(){
  const ua = navigator.userAgent;
  const isInApp = /(FBAN|FBAV|FB_IAB|Line|Instagram|GSA|Twitter|TikTok|Snap|Pinterest|DuckDuckGo)/i.test(ua);
  const isSafariVC = /\bSFSafariViewController\b/i.test(ua);
  const notTop = (top !== self);
  const notHttps = location.protocol !== "https:";
  if (isInApp || isSafariVC || notTop || notHttps) {
    const bar = document.createElement("div");
    bar.className = "banner";
    bar.innerHTML = 'For Apple Pay, open in Safari. <a href="'+location.href+'">Open</a>';
    document.body.appendChild(bar);
    log("Context might block Apple Pay:", { isInApp, isSafariVC, notTop, notHttps, ua });
  }
})();

(async () => {
  // ===== YOUR CONFIG =====
  const PUBLISHABLE_KEY    = "pk_test_51ObAxXDRnH8DK8R5nX6dHGi7xwvx4BiWVzdQRMWqWadtEaLUm08hoGaugND76UTP9OuELxXJvqewWVHFEBB1ck7J00Jc9MvsTG";
  const SETUP_INTENT_URL   = "https://rkwv6kbjm3d6bmpmwc4h2p6ppe0wvgth.lambda-url.us-east-1.on.aws/"; // returns { clientSecret }
  const CREATE_SUB_URL     = "https://kr57xusgm2fufauejxnxwfq72q0sctva.lambda-url.us-east-1.on.aws/";  // expects { paymentMethodId, userId, email, sub_type, isDiscounted }
  const SUCCESS_RETURN_URL = "https://parallellive.app/checkout_redirect/success"; // TODO: your Universal Link
  // ========================

  // Params (?userId=...&sub_type=weekly|annual&isDiscounted=true|false&email=...)
  const url          = new URL(location.href);
  const userId       = url.searchParams.get("userId") || "";
  const sub_type     = url.searchParams.get("sub_type") || "weekly";
  const isDiscounted = (url.searchParams.get("isDiscounted") || "false") === "true";
  const emailParam   = url.searchParams.get("email") || "";

  // Environment probes
  log("host", location.host, "https", location.protocol === "https:", "top-level", top === self);
  log("UA", navigator.userAgent);
  log("ApplePaySession exists:", !!window.ApplePaySession,
      "native canMakePayments:", window.ApplePaySession?.canMakePayments?.());

  // 1) Fetch SetupIntent to collect a PaymentMethod
  log("POST SetupIntent", { url: SETUP_INTENT_URL, body: { userId } });
  let clientSecret = "";
  try {
    const res  = await fetch(SETUP_INTENT_URL, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({ userId })
    });
    const text = await res.text();
    log("SetupIntent status", res.status, "raw:", text);
    let json = {};
    try { json = JSON.parse(text); } catch(e) { throw new Error("SetupIntent non-JSON: " + text.slice(0, 300)); }
    if (!res.ok) throw new Error(json.error || ("HTTP " + res.status));
    if (!json.clientSecret) throw new Error("No clientSecret in SetupIntent response");
    clientSecret = json.clientSecret;
    log("clientSecret (setup) prefix", clientSecret.substring(0, 24) + "…");
  } catch (e) {
    log("SetupIntent fetch error:", e.message);
    return;
  }

  // 2) Init Stripe (setup mode) + Payment Request Button (Apple Pay)
  const stripe   = Stripe(PUBLISHABLE_KEY);
  log("Stripe.js version", stripe.version || "n/a");
  const elements = stripe.elements({ clientSecret }); // setup-mode is key

  const pr = stripe.paymentRequest({
    country: "US",
    currency: "usd",
    total: { label: "Pro Access", amount: 0 }, // ignored for setup
    requestPayerEmail: true
  });

  let can = null;
  try { can = await pr.canMakePayment(); } catch(e) { log("canMakePayment error", e.message); }
  log("Stripe canMakePayment →", can);

  if (!(can && (can.applePay || can.applePay === true))) {
    document.getElementById("apple").style.display = "none";
    log("Apple Pay unavailable for this context. Likely in-app browser/SFSafariVC, not HTTPS/top-level, or domain not enabled.");
    return;
  }

  // Make the container very visible and on top
  const container = document.getElementById("apple");
  Object.assign(container.style, {
    minHeight: "64px",
    width: "100%",
    maxWidth: "480px",
    margin: "24px auto",
    background: "rgba(0, 200, 255, 0.08)",
    outline: "2px dashed #0af",
    outlineOffset: "4px",
    position: "relative",
    zIndex: "9999"
  });

  const btn = elements.create("paymentRequestButton", {
    paymentRequest: pr,
    style: { paymentRequestButton: { type: "applePay" } } // default, visible on dark bg
  });
  btn.on("ready", () => log("PRB ready"));

  try {
    btn.mount("#apple");
    log("PRB mounted");
  } catch(e) {
    log("PRB mount error", e.message);
    return;
  }

  // ---- Post-mount diagnostics (layout / iframe presence) ----
  setTimeout(() => {
    const rect = container.getBoundingClientRect();
    const ifr  = container.querySelector("iframe");
    const cs   = getComputedStyle(container);
    log("Container rect", rect);
    log("Container styles", {
      display: cs.display, visibility: cs.visibility, opacity: cs.opacity,
      position: cs.position, zIndex: cs.zIndex, transform: cs.transform,
      overflow: cs.overflow
    });
    log("Child nodes", container.childNodes.length);
    log("Stripe iframe present?", !!ifr, ifr && { w: ifr.offsetWidth, h: ifr.offsetHeight });
    if (ifr) {
      // Try to ensure it isn't clipped by a parent
      let p = container.parentElement, hop = 0;
      while (p && hop++ < 4) {
        const pcs = getComputedStyle(p);
        log(`Parent[${hop}]`, { tag: p.tagName, overflow: pcs.overflow, position: pcs.position, zIndex: pcs.zIndex });
        p = p.parentElement;
      }
    }
  }, 350);

  // 3) On Apple Pay tap → confirm SetupIntent → create subscription → redirect
  pr.on("paymentmethod", async (ev) => {
    log("PRB paymentmethod", { pm: ev.paymentMethod && ev.paymentMethod.id, payerEmail: ev.payerEmail });

    try {
      const setupRes = await stripe.confirmCardSetup(clientSecret, {
        payment_method: ev.paymentMethod.id,
        payment_method_data: {
          billing_details: { email: ev.payerEmail || emailParam || undefined }
        }
      });
      log("confirmCardSetup result", setupRes);

      if (setupRes.error) {
        ev.complete("fail");
        log("confirmCardSetup error", setupRes.error);
        return;
      }

      ev.complete("success");
      const paymentMethodId = setupRes.setupIntent?.payment_method || ev.paymentMethod.id;
      log("Using paymentMethodId", paymentMethodId);

      // Create subscription
      const payload = {
        paymentMethodId,
        userId,
        email: ev.payerEmail || emailParam || "",
        sub_type,
        isDiscounted
      };
      log("POST CreateSubscription", { url: CREATE_SUB_URL, body: payload });

      const subRes = await fetch(CREATE_SUB_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const subText = await subRes.text();
      log("CreateSubscription status", subRes.status, "raw:", subText);
      let subJson = {};
      try { subJson = JSON.parse(subText); } catch(_) {}
      if (!subRes.ok || subJson.error) throw new Error(subJson.error || ("Create subscription failed (" + subRes.status + ")"));

      const sid = subJson.subscriptionId || "";
      const redirect = new URL(SUCCESS_RETURN_URL);
      redirect.searchParams.set("userId", userId);
      redirect.searchParams.set("sub_type", sub_type);
      if (sid) redirect.searchParams.set("sid", sid);
      log("Redirecting to", redirect.toString());
      location.href = redirect.toString();

    } catch(e) {
      log("Apple Pay flow error", e.message);
    }
  });
})();
</script>
</body>
</html>
